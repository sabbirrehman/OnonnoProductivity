<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnonnoProductivity</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 450px; background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h1 { margin-top: 0; color: #58a6ff; text-align: center; font-size: 1.6rem; }
    p.subtitle { text-align: center; color: #8b949e; font-size: 0.9rem; margin-bottom: 20px; }
    .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; outline: none; }
    input[type="text"]:focus { border-color: #58a6ff; }
    button.add-btn { background: #238636; color: #fff; border: none; padding: 12px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button.add-btn:hover { background: #2ea043; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: #21262d; border: 1px solid #30363d; padding: 12px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    li.completed { text-decoration: line-through; opacity: 0.5; }
    .delete-btn { background: #da3633; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>OnonnoProductivity</h1>
    <p class="subtitle">Minimalist Task Tracker for Web, PC & Android</p>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <button class="add-btn" onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", loadTasks);

    function addTask() {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();
      if (text === "") return;

      const tasks = getSavedTasks();
      tasks.push({ text: text, completed: false });
      saveTasks(tasks);

      input.value = "";
      renderTasks();
    }

    function toggleTask(index) {
      const tasks = getSavedTasks();
      tasks[index].completed = !tasks[index].completed;
      saveTasks(tasks);
      renderTasks();
    }

    function deleteTask(index) {
      const tasks = getSavedTasks();
      tasks.splice(index, 1);
      saveTasks(tasks);
      renderTasks();
    }

    function getSavedTasks() {
      return JSON.parse(localStorage.getItem("ononno_tasks") || "[]");
    }

    function saveTasks(tasks) {
      localStorage.setItem("ononno_tasks", JSON.stringify(tasks));
    }

    function renderTasks() {
      const list = document.getElementById("taskList");
      list.innerHTML = "";
      const tasks = getSavedTasks();

      tasks.forEach((task, index) => {
        const li = document.createElement("li");
        if (task.completed) li.classList.add("completed");
        
        li.innerHTML = `
          <span onclick="toggleTask(${index})" style="cursor:pointer; flex:1;">${task.text}</span>
          <button class="delete-btn" onclick="deleteTask(${index})">✕</button>
        `;
        list.appendChild(li);
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
