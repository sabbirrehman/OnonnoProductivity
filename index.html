<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnonnoProductivity</title>

  <!-- PWA Metadata -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/png" href="icon-192.png">

  <style>
    /* Reset & Clean Theme */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }

    .container {
      max-width: 500px;
      width: 100%;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: #8b949e;
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    /* Action Buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.875rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background-color 0.2s;
    }

    /* Install PWA Button (Primary) */
    .btn-install {
      background-color: #238636;
      color: #ffffff;
      display: none; /* Controlled by JS */
    }

    .btn-install:hover {
      background-color: #2ea043;
    }

    /* GitHub Button */
    .btn-github {
      background-color: #21262d;
      color: #c9d1d9;
      border-color: #30363d;
    }

    .btn-github:hover {
      background-color: #30363d;
      color: #ffffff;
    }

    /* Android Release Button */
    .btn-android {
      background-color: #1f6feb;
      color: #ffffff;
    }

    .btn-android:hover {
      background-color: #388bfd;
    }

    /* Footer */
    footer {
      margin-top: 3rem;
      color: #484f58;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>OnonnoProductivity</h1>
    <p class="subtitle">Minimalist cross-platform productivity for PC & Android.</p>

    <div class="actions">
      <!-- PWA Install Button (Appears when installable) -->
      <button id="installBtn" class="btn btn-install">
        ⚡ Install App (PWA)
      </button>

      <!-- Android App Download -->
      <a href="https://github.com/YOUR_USERNAME/OnonnoProductivity/releases" class="btn btn-android" target="_blank" rel="noopener">
        📱 Android Release (.apk)
      </a>

      <!-- GitHub Repository -->
      <a href="https://github.com/YOUR_USERNAME/OnonnoProductivity" class="btn btn-github" target="_blank" rel="noopener">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
        GitHub Repository
      </a>
    </div>

    <footer>
      OnonnoProductivity
    </footer>
  </main>

  <script>
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    // PWA Prompt Handler
    let installPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      installPrompt = e;
      installBtn.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      const { outcome } = await installPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
      }
      installPrompt = null;
    });
  </script>
</body>
</html>
